<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIMP Batch Operations</title><style>body{background:#101827;color:#e5edf8;font:14px system-ui;margin:20px}main{max-width:1500px;margin:auto}a{color:#7dd3fc}article{background:#1c293c;border:1px solid #34445c;border-radius:8px;padding:14px;margin:14px 0}.chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.job{border:1px solid #52647c;padding:10px;border-radius:6px;overflow-wrap:anywhere}button{background:#2563eb;color:white;border:0;border-radius:4px;padding:8px;margin:3px;cursor:pointer}button:disabled{opacity:.4}.SUCCESS{color:#86efac}.FAILED{color:#fca5a5}.RUNNING{color:#7dd3fc}.STOPPED{color:#fdba74}.WAITING{color:#cbd5e1}</style><main><h1>EIMP | Batch Operations</h1><p>Training simulation — no actual files, shell processes or Oracle jobs are executed.</p><p><a href="/support.html">Support login</a> · <a href="/business.html">Business monitoring</a> · <a href="/logs.html">Logs</a></p><button id="refresh">Refresh</button><p id="notice" role="status"></p><div id="summary"></div><div id="groups"></div></main><script>
const el=id=>document.getElementById(id);let busy=false;const base='/api/support/batches';const names=['Customer and policy','Premium','Claims','Settlement','Reconciliation and reporting'];
async function load(){if(busy)return;busy=true;try{const r=await fetch(base,{cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Sign in through the support dashboard first.':'HTTP '+r.status);const d=await r.json();render(d.jobs);el('notice').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){el('groups').replaceChildren();el('summary').textContent='';el('notice').textContent=e.message}finally{busy=false}}
function render(jobs){const root=el('groups');root.replaceChildren();el('summary').textContent=['WAITING','RUNNING','SUCCESS','FAILED','STOPPED'].map(s=>s+': '+jobs.filter(j=>j.status===s).length).join(' | ');for(let g=1;g<=5;g++){const article=document.createElement('article'),h=document.createElement('h2'),chain=document.createElement('div');h.textContent='EIMP_BATCH_0'+g+' — '+names[g-1];chain.className='chain';for(const j of jobs.filter(j=>j.id.startsWith('EIMP_BATCH_0'+g+'_'))){const card=document.createElement('div');card.className='job';for(const value of [j.id,j.name,'Dependency: '+(j.dependency||'None'),j.status,new Date(j.updatedAt).toLocaleString()]){const p=document.createElement('p');p.textContent=value;if(value===j.status)p.className=j.status;card.append(p)}for(const action of ['start','success','fail','stop']){const b=document.createElement('button');b.textContent=action==='start'&&['FAILED','STOPPED'].includes(j.status)?'Restart':action;b.disabled=action==='start'?(!['WAITING','FAILED','STOPPED'].includes(j.status)||(j.dependency&&jobs.find(x=>x.id===j.dependency)?.status!=='SUCCESS')):j.status!=='RUNNING';b.onclick=()=>run(j.id,action);card.append(b)}chain.append(card)}article.append(h,chain);root.append(article)}}
async function run(id,action){if(busy)return;busy=true;let message='';try{const r=await fetch(base+'/'+encodeURIComponent(id)+'/'+action,{method:'POST'});message=r.ok?'Action completed: '+action:'Action rejected: HTTP '+r.status}catch(e){message=e.message}finally{busy=false;await load();el('notice').textContent=message}}
el('refresh').onclick=load;load();
</script></html>
