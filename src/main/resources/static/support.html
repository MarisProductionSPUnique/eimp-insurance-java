<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIMP Production Support</title><style>body{margin:0;background:#eef3f8;color:#14283e;font:16px system-ui}header{background:#123453;color:white;padding:24px}main{max-width:1050px;margin:auto;padding:20px}section,article{background:white;border:1px solid #ccd8e2;padding:20px;border-radius:10px;margin-bottom:14px}input,button{font:inherit;padding:10px;margin:6px}button{background:#126b76;color:white;border:0;border-radius:6px;cursor:pointer}label{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}[hidden]{display:none!important}</style></head><body><header><h1>EIMP Production Support</h1>UNIQ Training | Operations dashboard</header><main><p id="notice" role="status"></p><section id="login"><h2>Support login</h2><form id="form"><label>Username <input id="username" autocomplete="username" required></label><label>Password <input id="password" type="password" autocomplete="current-password" required></label><button>Login</button></form></section><section id="dashboard" hidden><h2 id="identity"></h2><button id="refresh">Refresh health check</button><button id="logout">Logout</button><div id="metrics" class="grid"></div><h2>Live runtime monitoring</h2><p id="scope"></p><div id="runtime" class="grid"></div><p>Database connectivity, logs and incident monitoring will be added in subsequent phases.</p></section></main><script>
const el=id=>document.getElementById(id);let generation=0;
async function api(path,body){const r=await fetch('/api/support/'+path,{credentials:'same-origin',cache:'no-store',...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})});if(!r.ok)throw Error('HTTP '+r.status);return r.status===204?null:r.json()}
function note(s){el('notice').textContent=s}
function reset(){el('dashboard').hidden=true;el('login').hidden=false;el('metrics').replaceChildren();el('runtime').replaceChildren()}
async function load(){const g=++generation;try{const h=await api('health');if(g!==generation)return;el('login').hidden=true;el('dashboard').hidden=false;el('identity').textContent=h.username+' | SUPPORT';el('metrics').replaceChildren();for(const [label,value] of Object.entries({'Application':h.application,'Application status':h.status,'JVM uptime (seconds)':h.uptimeSeconds,'Database configuration':h.database,'Last check':new Date(h.timestamp).toLocaleString()})){const card=document.createElement('article'),title=document.createElement('h3'),p=document.createElement('p');title.textContent=label;p.textContent=value;card.append(title,p);el('metrics').append(card)}const m=await api('metrics');if(g!==generation)return;el('scope').textContent=m.scope;el('runtime').replaceChildren();const mb=x=>x==null||x<0?'Unavailable':(x/1048576).toFixed(1)+' MiB';const pct=x=>x==null?'Unavailable':x.toFixed(1)+'%';for(const [label,value] of Object.entries({'Runtime CPU':pct(m.systemCpuPercent),'Java CPU':pct(m.processCpuPercent),'Memory total':mb(m.memoryTotalBytes),'Memory free':mb(m.memoryFreeBytes),'Filesystem total':mb(m.diskTotalBytes),'Filesystem usable':mb(m.diskUsableBytes),'JVM heap used':mb(m.heapUsedBytes),'JVM heap max':mb(m.heapMaxBytes),'JVM heap committed':mb(m.heapCommittedBytes),'Active threads':m.threads,'Peak threads':m.peakThreads,'Available processors':m.processors})){const card=document.createElement('article'),title=document.createElement('h3'),p=document.createElement('p');title.textContent=label;p.textContent=value;card.append(title,p);el('runtime').append(card)}note('Health check completed')}catch(e){if(g===generation){reset();note('Health check unavailable: '+e.message)}}}
el('form').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;try{await api('login',{username:el('username').value,password:el('password').value});await load()}catch(e){note('Login failed: '+e.message)}finally{el('password').value='';b.disabled=false}};
el('refresh').onclick=load;el('logout').onclick=async()=>{++generation;try{await api('logout',{});reset();note('Logged out')}catch(e){reset();note('Logout response: '+e.message)}};load();
</script></body></html>
