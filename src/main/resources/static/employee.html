<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIMP Employee Portal</title><style>body{margin:0;background:#f1f5f9;color:#14283e;font:16px system-ui}header{background:#123453;color:white;padding:24px}main{max-width:1050px;margin:auto;padding:20px}section,article{background:white;border:1px solid #ccd8e2;padding:20px;border-radius:10px;margin-bottom:14px}input,textarea,button{font:inherit;padding:10px;margin:5px;max-width:90%}button{background:#126b76;color:white;border:0;border-radius:6px;cursor:pointer}label{display:block}p{overflow-wrap:anywhere}[hidden]{display:none!important}</style></head><body><header><h1>EIMP Employee Portal</h1>Underwriting and claims operations · Training only</header><main><a href="/">Customer portal</a><p id="notice" role="status"></p><section id="login"><h2>Employee login</h2><form id="form"><label>Username <input id="username" autocomplete="username" required></label><label>Password <input id="password" type="password" autocomplete="current-password" required></label><button>Login</button></form></section><section id="dashboard" hidden><h2 id="identity"></h2><button id="refresh">Refresh applications</button><button id="logout">Logout</button><h3>Policy applications</h3><div id="policies"></div><h3>Decision history</h3><div id="history"></div><h3>Claims management</h3><div id="claims"></div><h3>Claim history</h3><div id="claimHistory"></div></section></main><script>
const el=id=>document.getElementById(id);
async function api(path,body){const r=await fetch('/api/'+path,{credentials:'same-origin',...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})});if(!r.ok)throw Error('Request failed: HTTP '+r.status);return r.status===204?null:r.json()}
function note(s){el('notice').textContent=s}
function line(parent,s){const p=document.createElement('p');p.textContent=s;parent.append(p)}
function reset(){el('dashboard').hidden=true;el('login').hidden=false;el('policies').replaceChildren();el('history').replaceChildren();el('claims').replaceChildren();el('claimHistory').replaceChildren()}
let generation=0;
async function load(){const g=++generation;try{const [me,policies,history]=await Promise.all([api('employees/me'),api('policies/underwriting'),api('policies/underwriting/history')]);if(g!==generation)return;el('login').hidden=true;el('dashboard').hidden=false;el('identity').textContent=me.username+' | '+me.role;el('policies').replaceChildren();el('history').replaceChildren();if(!policies.length)line(el('policies'),'No applications yet.');for(const p of policies){const card=document.createElement('article');line(card,p.policyId+' | '+p.productCode+' | '+p.status);line(card,'Customer: '+p.customerId+' | Age: '+p.age+' | Coverage: INR '+p.coverage+' | Premium: INR '+p.annualPremium);if(p.status==='PENDING_UNDERWRITING'){const reason=document.createElement('textarea');reason.placeholder='Decision reason';reason.maxLength=500;reason.setAttribute('aria-label','Decision reason');card.append(reason);const buttons=[];for(const decision of ['APPROVED','REJECTED']){const b=document.createElement('button');buttons.push(b);b.textContent=decision==='APPROVED'?'Approve':'Reject';b.onclick=async()=>{if(!reason.value.trim()){note('Enter a decision reason.');return}buttons.forEach(x=>x.disabled=true);try{await api('policies/underwriting/'+encodeURIComponent(p.policyId),{decision,reason:reason.value});note('Decision saved.');await load()}catch(e){note(e.message)}finally{buttons.forEach(x=>x.disabled=false)}};card.append(b)}}el('policies').append(card)}if(!history.length)line(el('history'),'No decisions yet.');for(const d of history)line(el('history'),d.policyId+' | '+d.decision+' | '+d.reason+' | '+d.employee+' | '+new Date(d.decidedAt).toLocaleString());await loadClaims(g)}catch(e){if(g===generation){reset();note(e.message+' — employee login required.')}}}
async function loadClaims(g){const [claims,history]=await Promise.all([api('claims/employee'),api('claims/employee/history')]);if(g!==generation)return;el('claims').replaceChildren();el('claimHistory').replaceChildren();if(!claims.length)line(el('claims'),'No claims yet.');for(const c of claims){const card=document.createElement('article');line(card,c.claimId+' | '+c.status);line(card,c.policyId+' | INR '+c.amount);line(card,c.description);const actions={SUBMITTED:['UNDER_VERIFICATION'],UNDER_VERIFICATION:['VERIFIED','REJECTED'],VERIFIED:['APPROVED','REJECTED'],APPROVED:['SETTLEMENT_PENDING'],SETTLEMENT_PENDING:['SETTLED']}[c.status]||[];if(actions.length){const reason=document.createElement('textarea');reason.placeholder='Action reason';reason.maxLength=500;card.append(reason);for(const status of actions){const b=document.createElement('button');b.textContent=status.replaceAll('_',' ');b.onclick=async()=>{if(!reason.value.trim()){note('Enter a reason');return}b.disabled=true;try{await api('claims/employee/'+encodeURIComponent(c.claimId),{status,reason:reason.value});note('Claim updated');await load()}catch(e){note(e.message)}finally{b.disabled=false}};card.append(b)}}el('claims').append(card)}for(const h of history)line(el('claimHistory'),h.claimId+' | '+h.status+' | '+h.reason+' | '+h.employee+' | '+new Date(h.at).toLocaleString())}
el('form').onsubmit=async e=>{e.preventDefault();try{await api('employees/login',{username:el('username').value,password:el('password').value});note('Login successful.');await load()}catch(e){note(e.message)}finally{el('password').value=''}};
el('refresh').onclick=load;el('logout').onclick=async()=>{try{await api('employees/logout',{});++generation;reset();note('Logged out.')}catch(e){note(e.message)}};load();
</script></body></html>
