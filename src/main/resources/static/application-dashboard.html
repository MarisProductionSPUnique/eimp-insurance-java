<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIQ Application Access Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1726;color:#e2e8f0;font:16px system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:30px}p{color:#aebdd0}input,select{padding:12px;background:#1b293c;color:white;border:1px solid #40536a;border-radius:8px;max-width:100%}.filters{display:flex;gap:10px;flex-wrap:wrap}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}article{background:#192638;border:1px solid #34465d;border-radius:12px;padding:18px;display:flex;flex-direction:column}small{color:#7dd3fc}h3{margin:12px 0 0}a{color:#7dd3fc;overflow-wrap:anywhere;font-size:13px}.open{background:#2563eb;color:white;padding:10px;text-decoration:none;border-radius:7px;text-align:center;margin-top:16px;font-size:15px}article p{flex:1}footer{margin-top:25px;color:#aebdd0}.access{background:#101c2c;border:1px solid #40536a;border-radius:8px;padding:10px;margin:0 0 12px;font-size:13px;color:#cbd5e1}.access strong{display:block;color:#7dd3fc;margin-bottom:5px}</style><main><h1>UNIQ | Application Access Dashboard</h1><p>IBS Banking &amp; EIMP Insurance • Java production support training</p><div class="filters"><input id="q" placeholder="Search portals or functionality" aria-label="Search"><select id="app" aria-label="Application"><option>All</option><option>IBS</option><option>EIMP</option><option>Shared</option></select><select id="cat" aria-label="Category"><option>All</option><option>Business</option><option>Monitoring</option><option>Troubleshooting</option><option>Administration</option><option>ITSM</option></select></div><p id="count"></p><div id="groups"></div><footer>Portal directory, not a live health check. Protected portals require their own login. Render free services may sleep. Administrative links require authorized access.</footer></main><script>const data=[["IBS","Customer Banking","Business","https://ibs-banking-webserver.onrender.com","Customer banking application through the web server."],["IBS","Application Server","Business","https://ibs-banking-appserver.onrender.com","Java application server and backend services."],["IBS","Support Console","Monitoring","https://ibs-banking-appserver.onrender.com/support.html","Production support console and operational checks."],["IBS","Grafana-style Monitor","Monitoring","https://ibs-banking-webserver.onrender.com/monitor.html","Grafana-style runtime metrics, selectable refresh intervals, latency and thread trends, API probe success rate and CSV export."],["IBS","Splunk-style Log Analyzer","Troubleshooting","https://ibs-banking-webserver.onrender.com/logs.html","Splunk-style request log search, UTC time range and status filtering, saved searches and log export."],["IBS","Web Server Deployment","Administration","https://dashboard.render.com/web/srv-dc34qq7avr4c73eaf4t0","Manage web server deployments and logs."],["IBS","App Server Deployment","Administration","https://dashboard.render.com/web/srv-dc34o4vavr4c73ea6o80","Manage Java server deployments and logs."],["IBS","Source Code","Administration","https://github.com/MarisProductionSPUnique/ibs-banking-java","Java banking source code."],["EIMP","Customer Portal","Business","https://eimp-insurance-app.onrender.com/","Register, request quotations, apply for policies, pay premiums and submit claims."],["EIMP","Employee Portal","Business","https://eimp-insurance-app.onrender.com/employee.html","Underwriting, claim verification, approval and settlement."],["EIMP","Production Support","Monitoring","https://eimp-insurance-app.onrender.com/support.html","Support login, JVM resources and API metrics."],["EIMP","Log Analyzer","Troubleshooting","https://eimp-insurance-app.onrender.com/logs.html","Search HTTP and Java exception logs."],["EIMP","Error Simulator","Troubleshooting","https://eimp-insurance-app.onrender.com/simulator.html","Generate controlled HTTP, Java and business failures."],["EIMP","Business Monitoring","Monitoring","https://eimp-insurance-app.onrender.com/business.html","Track policies, premiums, claims and settlements."],["EIMP","Batch Monitoring","Monitoring","https://eimp-insurance-app.onrender.com/batches.html","Monitor 30 simulated dependent jobs, history and SLA."],["EIMP","Alert Configuration","Monitoring","https://eimp-insurance-app.onrender.com/alerts.html","Configure thresholds, active flags and maintenance mode; incident delivery pending."],["EIMP","Render Deployment","Administration","https://dashboard.render.com/web/srv-dc3qts5g1s2s73cfacag","Manage insurance application deployment."],["EIMP","Source Code","Administration","https://github.com/MarisProductionSPUnique/eimp-insurance-java","Java insurance source code."],["Shared","ServiceNow Service Desk","ITSM","https://uniq-service-desk.onrender.com","Independent training simulator; not affiliated with ServiceNow. Automatic EIMP incident integration pending."],["IBS","Web Server Health","Monitoring","https://ibs-banking-webserver.onrender.com/web-health","Check Nginx web-server availability."],["IBS","Application Health API","Monitoring","https://ibs-banking-appserver.onrender.com/api/health","Check Java application availability; Oracle customer login and read-only accounts are deployed; this endpoint does not verify Oracle connectivity."],["IBS","Runtime Health API","Monitoring","https://ibs-banking-appserver.onrender.com/api/runtime-health","View JVM, CPU, memory, thread and visible filesystem metrics as JSON."],["IBS","GitHub Actions","Administration","https://github.com/MarisProductionSPUnique/ibs-banking-java/actions","Review build, functional and Nginx proxy validation results."]];const access=[["Customer account","Use your assigned Oracle training customer credentials."],["Customer account","Use your banking customer credentials where prompted."],["Support access","Obtain the support credential from the trainer."],["Support access","Sign in to the IBS support console if prompted."],["Support access","Sign in to the IBS support console if prompted."],["Render account","Authorized administrator account only."],["Render account","Authorized administrator account only."],["GitHub","Public source viewing; authorized account for changes."],["Customer account","Register or use your own customer credentials."],["Employee account","Username and password supplied by the trainer."],["Support account","Username and password supplied by the trainer."],["Support account","Sign in to EIMP Production Support first."],["Support account","Sign in to EIMP Production Support first."],["Support account","Sign in to EIMP Production Support first."],["Support account","Sign in to EIMP Production Support first."],["Support account","Sign in to EIMP Production Support first."],["Render account","Authorized administrator account only."],["GitHub","Public source viewing; authorized account for changes."],["Service desk account","Obtain your assigned login from the administrator."],["Health endpoint","No login required."],["Health endpoint","No login required."],["Runtime endpoint","No login required."],["GitHub account","Repository access may be required."]];function render(){const root=document.getElementById('groups');root.replaceChildren();const q=document.getElementById('q').value.toLowerCase(),a=document.getElementById('app').value,c=document.getElementById('cat').value;const filtered=data.filter(r=>(a==='All'||r[0]===a)&&(c==='All'||r[2]===c)&&r.join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=filtered.length+' of '+data.length+' links';for(const group of ['IBS','EIMP','Shared']){const items=filtered.filter(r=>r[0]===group);if(!items.length)continue;const h=document.createElement('h2');h.textContent=group==='IBS'?'IBS Banking':group==='EIMP'?'EIMP Insurance':'Shared Services';const s=document.createElement('section');root.append(h,s);for(const r of items){const card=document.createElement('article');const label=document.createElement('small');label.textContent=r[2];const title=document.createElement('h3');title.textContent=r[1];const p=document.createElement('p');p.textContent=r[4];const link=document.createElement('a');link.href=r[3];link.textContent=r[3];link.target='_blank';link.rel='noopener noreferrer';const open=link.cloneNode();open.className='open';open.textContent='Open portal';const box=document.createElement('div');box.className='access';const heading=document.createElement('strong');heading.textContent='Login details · '+access[data.indexOf(r)][0];const info=document.createElement('span');info.textContent=access[data.indexOf(r)][1];box.append(heading,info);const guide=document.createElement("a");guide.className="open";guide.style.background="#334155";guide.href="/functionality-guide.html?portal="+encodeURIComponent(r[3]);guide.textContent="Functionality Guide";card.append(label,title,p,box,link,open,guide);s.append(card)}}}for(const id of ['q','app','cat'])document.getElementById(id).addEventListener('input',render);render();</script></html>
